<mat-toolbar class="nav-toolbar">
    <!-- Лого -->
    <div class="nav-logo">
        <mat-icon class="logo-icon">favorite</mat-icon>
        <span class="logo-text">APP</span>
    </div>

    <div class="nav-divider"></div>

    <!-- Навигационни линкове -->
    <nav class="nav-links">
        @for (link of navLinks; track link.route) {
        <a class="nav-link" [routerLink]="link.route" routerLinkActive="active">
            {{ link.label }}
        </a>
        }
    </nav>

    <span class="nav-spacer"></span>

    <!-- Auth зона: логнат потребител ИЛИ login бутон -->
    @if (authService.currentUser(); as user) {
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-button">
        @if (user.imageUrl) {
        <img [src]="user.imageUrl" [alt]="user.displayName" class="user-avatar" />
        } @else {
        <mat-icon class="user-avatar-placeholder">account_circle</mat-icon>
        }
        <span class="user-name">{{ user.displayName }}</span>
    </button>

    <mat-menu #userMenu="matMenu">
        <button mat-menu-item [routerLink]="['/profile']">
            <mat-icon>person</mat-icon>
            <span>Профил</span>
        </button>
        <button mat-menu-item (click)="onLogout()">
            <mat-icon>logout</mat-icon>
            <span>Изход</span>
        </button>
    </mat-menu>
    } @else {
    <a mat-flat-button [routerLink]="['/login']" class="login-button">
        Login
    </a>
    }
</mat-toolbar>s
